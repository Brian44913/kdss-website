<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb1cf"/></marker></defs>
<rect width="900" height="410" rx="14" fill="#f6f8fb"/>
<text x="20" y="34" font-size="15" font-weight="700" fill="#1d5fd1" text-anchor="start">发现问题</text>
<rect x="20" y="46" width="135" height="44" rx="8" fill="#fff" stroke="#d3d9e4"/>
