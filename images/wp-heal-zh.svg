<rect x="20" y="292" width="860" height="92" rx="10" fill="#fff" stroke="#0f8a7e"/>
<text x="44" y="328" font-size="16" font-weight="700" fill="#0f8a7e" text-anchor="start">换盘之后：原位修复</text>
<text x="44" y="358" font-size="14.5" font-weight="400" fill="#111827" text-anchor="start">把该盘原有的数据重建后写回新盘的原位置。</text>
