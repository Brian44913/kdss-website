<text x="812.5" y="73" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">放置审计</text>
<path d="M450 94 L450 124" stroke="#9fb1cf" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="20" y="128" width="200" height="100" rx="10" fill="#fff" stroke="#d3d9e4"/><text x="120.0" y="166.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">隔离</text><text x="120.0" y="186.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">故障盘自动退出</text><text x="120.0" y="204.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">恢复后自动回归</text>
<line x1="221" y1="178" x2="239" y2="178" stroke="#9fb1cf" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="240" y="128" width="200" height="100" rx="10" fill="#fff" stroke="#d3d9e4"/><text x="340.0" y="166.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">建任务</text><text x="340.0" y="186.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">缺片最多的先修</text><text x="340.0" y="204.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">数十万条带分钟级入队</text>
<line x1="441" y1="178" x2="459" y2="178" stroke="#9fb1cf" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="460" y="128" width="200" height="100" rx="10" fill="#fff" stroke="#d3d9e4"/><text x="560.0" y="166.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">分布式领取</text><text x="560.0" y="186.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">多个 Master</text><text x="560.0" y="204.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">并行领取任务</text>
<line x1="661" y1="178" x2="679" y2="178" stroke="#9fb1cf" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="680" y="128" width="200" height="100" rx="10" fill="#0f2b5b" stroke="#0f2b5b"/><text x="780.0" y="166.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">本地重建</text><text x="780.0" y="186.0" font-size="13" font-weight="400" fill="#c9d8f5" text-anchor="middle">拉取存活分片</text><text x="780.0" y="204.0" font-size="13" font-weight="400" fill="#c9d8f5" text-anchor="middle">本地解码落盘</text>
