<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb1cf"/></marker></defs>
<rect width="900" height="300" rx="14" fill="#f6f8fb"/>
<rect x="30" y="26" width="272" height="170" rx="10" fill="#fff" stroke="#d3d9e4"/>
<rect x="30" y="26" width="272" height="6" rx="3" fill="#1d5fd1"/>
<text x="50" y="68" font-size="26" font-weight="800" fill="#1d5fd1" text-anchor="start">1</text>
<text x="80" y="66" font-size="16" font-weight="700" fill="#111827" text-anchor="start">集群拒写线</text>
<text x="50" y="104" font-size="15" font-weight="700" fill="#1d5fd1" text-anchor="start">默认 99%</text>
<text x="50" y="140" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">整体达到后停止新写入</text>
<text x="50" y="162" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">修复照常进行</text>
<rect x="314" y="26" width="272" height="170" rx="10" fill="#fff" stroke="#d3d9e4"/>
<rect x="314" y="26" width="272" height="6" rx="3" fill="#0f2b5b"/>
<text x="334" y="68" font-size="26" font-weight="800" fill="#0f2b5b" text-anchor="start">2</text>
<text x="364" y="66" font-size="16" font-weight="700" fill="#111827" text-anchor="start">单盘写入上限</text>
<text x="334" y="104" font-size="15" font-weight="700" fill="#0f2b5b" text-anchor="start">默认 99.5%，可配到 99.8%</text>
<text x="334" y="140" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">该盘退出写入环</text>
<text x="334" y="162" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">只接收修复数据</text>
<rect x="598" y="26" width="272" height="170" rx="10" fill="#fff" stroke="#d3d9e4"/>
<rect x="598" y="26" width="272" height="6" rx="3" fill="#b7791f"/>
<text x="618" y="68" font-size="26" font-weight="800" fill="#b7791f" text-anchor="start">3</text>
<text x="648" y="66" font-size="16" font-weight="700" fill="#111827" text-anchor="start">单盘只读</text>
<text x="618" y="104" font-size="15" font-weight="700" fill="#b7791f" text-anchor="start">剩余 &lt; 4 GiB</text>
<text x="618" y="140" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">完全只读</text>
<text x="618" y="162" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">保护盘上已有数据</text>
<text x="30" y="232" font-size="14.5" font-weight="400" fill="#111827" text-anchor="start">控制台实时显示「当前最大可写」与「当前保守可写」。</text>
<text x="30" y="260" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">阈值为默认值，可按集群配置。</text>
</svg>