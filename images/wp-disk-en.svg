<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb1cf"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#f6f8fb"/>
<text x="30" y="40" font-size="17" font-weight="700" fill="#0f2b5b" text-anchor="start">One HDD (raw block device, no local file system)</text>
<rect x="30" y="78" width="74" height="64" fill="#0f2b5b" stroke="#fff"/>
<text x="67.0" y="115.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">SB</text>
<rect x="104" y="78" width="92" height="64" fill="#1d5fd1" stroke="#fff"/>
<text x="150.0" y="115.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">shard</text>
<rect x="196" y="78" width="92" height="64" fill="#1d5fd1" stroke="#fff"/>
<text x="242.0" y="115.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">shard</text>
<rect x="288" y="78" width="84" height="64" fill="#fff" stroke="#d3d9e4" stroke-dasharray="5 4"/>
<text x="330.0" y="115.0" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle">hole</text>
<rect x="372" y="78" width="92" height="64" fill="#1d5fd1" stroke="#fff"/>
<text x="418.0" y="115.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">shard</text>
<rect x="464" y="78" width="92" height="64" fill="#1d5fd1" stroke="#fff"/>
<text x="510.0" y="115.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">shard</text>
<rect x="556" y="78" width="92" height="64" fill="#1d5fd1" stroke="#fff"/>
<text x="602.0" y="115.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">shard</text>
<rect x="648" y="78" width="222" height="64" fill="#fff" stroke="#d3d9e4"/>
<rect x="30" y="78" width="840" height="64" fill="none" stroke="#0f2b5b" stroke-width="1.4" rx="4"/>
<line x1="648" y1="68" x2="648" y2="152" stroke="#0f8a7e" stroke-width="2.6"/>
<text x="658" y="170" font-size="14" font-weight="700" fill="#0f8a7e" text-anchor="start">Write frontier →</text>
<text x="658" y="190" font-size="13" font-weight="400" fill="#0f8a7e" text-anchor="start">sequential append, 4 KB aligned</text>
<text x="30" y="170" font-size="14" font-weight="700" fill="#0f2b5b" text-anchor="start">Primary + backup superblock (CRC)</text>
<text x="30" y="190" font-size="13" font-weight="400" fill="#0f2b5b" text-anchor="start">node ID · disk ID · disk UUID</text>
<text x="330" y="64" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">Hole: reused by same-size writes after the freeze period</text>
<rect x="30" y="230" width="272" height="72" rx="10" fill="#fff" stroke="#d3d9e4"/><text x="166.0" y="262.5" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Local index (BadgerDB)</text><text x="166.0" y="282.5" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">CRC32 verified on every read</text>
<rect x="314" y="230" width="272" height="72" rx="10" fill="#fff" stroke="#d3d9e4"/><text x="450.0" y="262.5" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Crash recovery</text><text x="450.0" y="282.5" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">scan forward from the frontier</text>
<rect x="598" y="230" width="272" height="72" rx="10" fill="#fff" stroke="#d3d9e4"/><text x="734.0" y="262.5" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Compaction</text><text x="734.0" y="282.5" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">move tail data into holes, truncate</text>
</svg>