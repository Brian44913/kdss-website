<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- KDSS mark: two offset squares (redundancy); the teal overlap is the parity that heals.
       Dark browser themes get a lighter back square so the mark stays visible.
       两个错位方块代表冗余，交叠处青绿色代表可自愈的校验；深色主题下后方方块改浅色以保持可见。 -->
  <style>
    .a { fill: #0f2b5b; } .b { fill: #1d5fd1; } .c { fill: #0f8a7e; }
    @media (prefers-color-scheme: dark) { .a { fill: #ffffff; } .b { fill: #2f74e6; } .c { fill: #2fc4b2; } }
  </style>
  <rect class="a" x="6" y="6" width="34" height="34" rx="8"/>
  <rect class="b" x="24" y="24" width="34" height="34" rx="8"/>
  <path class="c" d="M24 32 a8 8 0 0 1 8 -8 h8 v8 a8 8 0 0 1 -8 8 h-8 z"/>
</svg>
